<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<title>Не впади — Endless 3D Run</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87CEEB;font-family:system-ui,-apple-system,sans-serif;touch-action:none;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:flex;justify-content:space-between;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}
.panel{background:rgba(10,22,32,.85);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 14px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 4px 15px rgba(0,0,0,.3)}.panel .lbl{font-size:10px;letter-spacing:.1em;opacity:.7;font-weight:700;margin-bottom:2px}.panel .val{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stats-left{display:flex;flex-direction:column;gap:8px}.stats-right{display:flex;flex-direction:column;gap:8px;text-align:right}
#startScreen,#gameOverScreen{position:fixed;inset:0;z-index:10;background:rgba(8,19,31,.9);display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(5px);transition:opacity .4s}#gameOverScreen{opacity:0;pointer-events:none}#gameOverScreen.show{opacity:1;pointer-events:auto}
.modal{max-width:360px;width:100%;background:#0e1e2c;border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:30px 24px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6)}.modal h1{font-size:32px;margin:0 0 8px;font-weight:900;letter-spacing:.05em}.modal p{font-size:14px;color:#c8d6e0;margin-bottom:20px;line-height:1.5}.score-big{font-size:48px;font-weight:900;color:#f7c948;margin:10px 0 20px}
button{background:linear-gradient(160deg,#2bd680,#128a52);color:#04140c;border:0;border-radius:16px;padding:16px 24px;font-size:16px;font-weight:900;width:100%;letter-spacing:.06em;cursor:pointer;box-shadow:0 8px 26px rgba(43,214,128,.3)}button:active{transform:scale(.97)}
.instructions{display:flex;justify-content:space-around;margin-top:20px;font-size:11px;color:#8fa3b5}.instructions span{display:block;font-size:20px;margin-bottom:4px}
</style>
</head>
<body>
<div id="hud"><div class="stats-left"><div class="panel"><div class="lbl">РАХУНОК</div><div class="val" id="scoreDisplay">0</div></div></div><div class="stats-right"><div class="panel"><div class="lbl">РЕКОРД</div><div class="val" id="highScoreDisplay">0</div></div><div class="panel"><div class="lbl">КРИСТАЛИ</div><div class="val" id="crystalsDisplay">0</div></div></div></div>
<div id="startScreen"><div class="modal"><h1>НЕ ВПАДИ</h1><div style="color:#54e6a2;font-weight:800;letter-spacing:.15em;font-size:12px;margin-bottom:15px">ENDLESS 3D RUN</div><p>Котись вперед, збирай кристали та ухиляйся від перешкод. Швидкість зростатиме!</p><button id="playBtn">ГРИ ▶</button><div class="instructions"><div><span>←</span> Вліво</div><div><span>→</span> Вправо</div><div><span>☝️</span> Свайп / Тап</div></div></div></div>
<div id="gameOverScreen"><div class="modal"><h1 style="color:#ff5a5a">ГРА ЗАКІНЧЕНА</h1><p>Ти зіткнувся з перешкодою</p><div class="score-big" id="finalScore">0</div><button id="restartBtn">СПРОБУВАТИ ЩЕ</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const CONFIG={laneWidth:2.5,startSpeed:15,maxSpeed:35,accel:.5,ballRadius:.45,spawnDistance:120,cleanupDistance:10};
let score=0,crystals=0,highScore=0;try{highScore=Number(localStorage.getItem('ndHighScore')||0)}catch(e){}
let gameSpeed=CONFIG.startSpeed,isPlaying=false,currentLane=1,targetX=0,ballX=0,obstacles=[],crystalItems=[],nextSpawnZ=-25;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,30,120);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x52614c,1.35));
const sun=new THREE.DirectionalLight(0xfff0dc,2);sun.position.set(-10,22,12);sun.castShadow=true;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
function createRoadTexture(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#918d83';x.fillRect(0,0,256,256);for(let r=0;r<8;r++){for(let col=0;col<4;col++){const xx=col*64-(r%2?16:0),yy=r*32,s=125+Math.floor(Math.random()*40);x.fillStyle=`rgb(${s},${s-3},${s-10})`;x.fillRect(xx+2,yy+2,60,28);x.strokeStyle='rgba(45,43,40,.65)';x.lineWidth=2;x.strokeRect(xx+2,yy+2,60,28)}}for(let i=0;i<700;i++){let s=Math.random()>.5?255:20;x.fillStyle=`rgba(${s},${s},${s},.045)`;x.fillRect(Math.random()*256,Math.random()*256,3,3)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,24);t.anisotropy=4;return t}
const roadMat=new THREE.MeshStandardMaterial({map:createRoadTexture(),roughness:.95});const road=new THREE.Mesh(new THREE.PlaneGeometry(15,240),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-80;road.receiveShadow=true;scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x5e9b4e,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.position.z=-100;scene.add(ground);
const shoulderMat=new THREE.MeshStandardMaterial({color:0xd9c49b,roughness:1});for(const side of [-1,1]){const sh=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,240),shoulderMat);sh.position.set(side*8.7,-.02,-80);sh.receiveShadow=true;scene.add(sh);const wall=new THREE.Mesh(new THREE.BoxGeometry(.25,.45,240),new THREE.MeshStandardMaterial({color:0xc8bda7,roughness:.85}));wall.position.set(side*7.55,.22,-80);wall.castShadow=wall.receiveShadow=true;scene.add(wall)}
function makePalm(){const g=new THREE.Group(),trunkMat=new THREE.MeshStandardMaterial({color:0x93683f,roughness:1}),leafMat=new THREE.MeshStandardMaterial({color:0x247a36,roughness:.85,side:THREE.DoubleSide});const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.32,4.2,8),trunkMat);trunk.position.y=2.1;trunk.rotation.z=(Math.random()-.5)*.12;trunk.castShadow=true;g.add(trunk);for(let i=0;i<7;i++){const a=i*Math.PI*2/7,leaf=new THREE.Mesh(new THREE.ConeGeometry(.32,2.7,5),leafMat);leaf.position.set(Math.cos(a)*.85,4.05-Math.abs(Math.cos(a))*.25,Math.sin(a)*.85);leaf.rotation.z=-Math.cos(a)*.7;leaf.rotation.x=Math.sin(a)*.7;leaf.rotation.y=a;leaf.castShadow=true;g.add(leaf)}return g}
function makeBush(){const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:[0x2d7837,0x3e8b3b,0x558e42][Math.floor(Math.random()*3)],roughness:1});for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.45+Math.random()*.25,1),mat);m.position.set((Math.random()-.5)*.7,.3+Math.random()*.25,(Math.random()-.5)*.7);m.castShadow=true;g.add(m)}return g}
function makeHouse(){const g=new THREE.Group(),colors=[0xf0d7a6,0xe5c6a0,0xcbd9c0,0xe9e0cf,0xf0c8ae],bodyMat=new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)],roughness:.95}),roofMat=new THREE.MeshStandardMaterial({color:[0x914b35,0x70443a,0x9c5a40][Math.floor(Math.random()*3)],roughness:1});const body=new THREE.Mesh(new THREE.BoxGeometry(3.6,2.5,3.2),bodyMat);body.position.y=1.35;body.castShadow=body.receiveShadow=true;g.add(body);const roof=new THREE.Mesh(new THREE.ConeGeometry(2.8,1.55,4),roofMat);roof.rotation.y=Math.PI/4;roof.position.y=3.2;roof.castShadow=true;g.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(.65,1.35,.08),new THREE.MeshStandardMaterial({color:0x68462f}));door.position.set(0,.72,1.65);g.add(door);const wm=new THREE.MeshStandardMaterial({color:0x7bc5d8,roughness:.3});for(const x of [-1.05,1.05]){const win=new THREE.Mesh(new THREE.BoxGeometry(.65,.65,.08),wm);win.position.set(x,1.65,1.65);g.add(win);const sm=new THREE.MeshStandardMaterial({color:0x387b56});for(const sx of [-.43,.43]){const sh=new THREE.Mesh(new THREE.BoxGeometry(.16,.75,.09),sm);sh.position.set(x+sx,1.65,1.7);g.add(sh)}}return g}
const scenery=[];for(let i=0;i<36;i++){const z=10-i*8;for(const side of [-1,1]){const x=side*(10+Math.random()*8),r=Math.random();let obj=r<.38?makePalm():r<.72?makeBush():makeHouse();obj.position.set(x,0,z+Math.random()*3);obj.rotation.y=side<0?Math.random()*.3:Math.PI+Math.random()*.3;scene.add(obj);scenery.push(obj)}}
const ballGroup=new THREE.Group(),ballGeo=new THREE.SphereGeometry(CONFIG.ballRadius,32,32),ballMat=new THREE.MeshStandardMaterial({color:0x3bc2c9,roughness:.2,metalness:.1}),ballMesh=new THREE.Mesh(ballGeo,ballMat);ballMesh.castShadow=ballMesh.receiveShadow=true;ballGroup.add(ballMesh);const stripe=new THREE.Mesh(new THREE.TorusGeometry(CONFIG.ballRadius+.01,.05,12,32),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4}));stripe.rotation.x=Math.PI/2;ballGroup.add(stripe);ballGroup.position.set(0,CONFIG.ballRadius,0);scene.add(ballGroup);camera.position.set(0,5,10);camera.lookAt(0,1,-10);
const crateMat=new THREE.MeshStandardMaterial({color:0xc28b56,roughness:.9}),coneMat=new THREE.MeshStandardMaterial({color:0xe87c2c,roughness:.7}),crystalMat=new THREE.MeshStandardMaterial({color:0x00f0ff,emissive:0x0088aa,roughness:.1,metalness:.6});
function spawnRow(z){const free=Math.floor(Math.random()*3);if(Math.random()<.75){const c=new THREE.Mesh(new THREE.OctahedronGeometry(.4),crystalMat);c.position.set((free-1)*CONFIG.laneWidth,.85,z);c.castShadow=true;scene.add(c);crystalItems.push(c)}for(let lane=0;lane<3;lane++){if(lane===free||Math.random()>=.55)continue;const o=Math.random()>.5?new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),crateMat):new THREE.Mesh(new THREE.ConeGeometry(.55,1.25,16),coneMat);o.position.set((lane-1)*CONFIG.laneWidth,.62,z-Math.random()*3);o.castShadow=o.receiveShadow=true;scene.add(o);obstacles.push(o)}}
function clearDynamic(){for(const o of obstacles)scene.remove(o);for(const c of crystalItems)scene.remove(c);obstacles=[];crystalItems=[]}
function updateHUD(){document.getElementById('scoreDisplay').textContent=Math.floor(score);document.getElementById('highScoreDisplay').textContent=Math.floor(highScore);document.getElementById('crystalsDisplay').textContent=crystals}
function gameOver(){if(!isPlaying)return;isPlaying=false;document.getElementById('finalScore').textContent=Math.floor(score);document.getElementById('gameOverScreen').classList.add('show')}
function moveLeft(){if(currentLane>0){currentLane--;targetX=(currentLane-1)*CONFIG.laneWidth}}function moveRight(){if(currentLane<2){currentLane++;targetX=(currentLane-1)*CONFIG.laneWidth}}
const clock=new THREE.Clock();
function startGame(){clearDynamic();score=0;crystals=0;gameSpeed=CONFIG.startSpeed;currentLane=1;targetX=ballX=0;ballGroup.position.set(0,CONFIG.ballRadius,0);ballMesh.rotation.set(0,0,0);nextSpawnZ=-25;for(let i=0;i<9;i++){spawnRow(nextSpawnZ);nextSpawnZ-=22+Math.random()*4}updateHUD();document.getElementById('startScreen').style.display='none';document.getElementById('gameOverScreen').classList.remove('show');isPlaying=true;clock.getDelta()}
function updateGame(){const dt=Math.min(clock.getDelta(),.05);if(!isPlaying)return;const dist=gameSpeed*dt;gameSpeed=Math.min(gameSpeed+CONFIG.accel*dt,CONFIG.maxSpeed);roadMat.map.offset.y-=dist*.025;for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=dist;if(!o.userData.hit&&Math.abs(o.position.z)<.95&&Math.abs(o.position.x-ballGroup.position.x)<.92){o.userData.hit=true;gameOver();return}if(o.position.z>CONFIG.cleanupDistance){scene.remove(o);obstacles.splice(i,1)}}for(let i=crystalItems.length-1;i>=0;i--){const c=crystalItems[i];c.position.z+=dist;c.rotation.y+=dt*3;c.rotation.x+=dt*1.5;if(Math.abs(c.position.z)<1.1&&Math.abs(c.position.x-ballGroup.position.x)<1){scene.remove(c);crystalItems.splice(i,1);crystals++;score+=10;continue}if(c.position.z>CONFIG.cleanupDistance){scene.remove(c);crystalItems.splice(i,1)}}nextSpawnZ+=dist;if(nextSpawnZ>-CONFIG.spawnDistance){spawnRow(nextSpawnZ-20);nextSpawnZ-=20+Math.random()*6}ballX=THREE.MathUtils.lerp(ballX,targetX,Math.min(1,10*dt));ballGroup.position.x=ballX;ballMesh.rotation.x-=dist/CONFIG.ballRadius;ballGroup.position.y=CONFIG.ballRadius+Math.sin(performance.now()*.01)*.04;for(const s of scenery){s.position.z+=dist;if(s.position.z>18)s.position.z-=288}camera.position.x=THREE.MathUtils.lerp(camera.position.x,ballGroup.position.x,Math.min(1,5*dt));camera.lookAt(ballGroup.position.x,ballGroup.position.y+1,-10);score+=gameSpeed*dt*.1;if(score>highScore){highScore=score;try{localStorage.setItem('ndHighScore',String(Math.floor(highScore)))}catch(e){}}updateHUD()}
addEventListener('keydown',e=>{if(!isPlaying)return;if(['ArrowLeft','a','A'].includes(e.key))moveLeft();if(['ArrowRight','d','D'].includes(e.key))moveRight()});
let tx=0,ty=0;addEventListener('touchstart',e=>{if(!isPlaying)return;tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});addEventListener('touchend',e=>{if(!isPlaying)return;const dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)){dx>0?moveRight():moveLeft()}else if(Math.abs(dx)<30&&Math.abs(dy)<30){e.changedTouches[0].screenX>innerWidth/2?moveRight():moveLeft()}},{passive:true});
document.getElementById('playBtn').addEventListener('click',startGame);document.getElementById('restartBtn').addEventListener('click',startGame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5))});
function animate(){requestAnimationFrame(animate);updateGame();renderer.render(scene,camera)}updateHUD();animate();
</script>
</body>
</html>
